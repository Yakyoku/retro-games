<!doctype html><meta charset="utf-8"><title>NIGHT SHAFT 3D キャラクターシート（確認用）</title>
<script type="importmap">{ "imports": { "three": "__VENDOR__/three.module.js", "three/addons/": "__VENDOR__/addons/" } }</script>
<body style="margin:0;background:#4a505b"><script type="module">
// 確認用: 3D の人物を、姿勢ごと・向きごとに並べる（公開ページからはリンクしない）
import * as THREE from 'three';
import { Person3D } from './chars3d.js';
import { LOOK } from '../../shared/art/palette.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(2000, 1100); r.setPixelRatio(1); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x5b616c);
scene.add(new THREE.HemisphereLight(0xc8d8ff, 0x3a3026, 1.25)); const d = new THREE.DirectionalLight(0xfff0dd, 0.9); d.position.set(3, 10, 6); scene.add(d);
const cam = new THREE.PerspectiveCamera(30, 2000 / 1100, 0.1, 100); cam.position.set(6.2, 3.2, 15.5); cam.lookAt(6.2, 2.4, 0);
const rows = [LOOK.agent, LOOK.guard[0], LOOK.guard[2]];
const poses = [['idle', 1], ['move', 1, 0.4, 0.2], ['move', 1, 1.2, 3.2], ['aim', 1], ['aimLow', 1], ['jump', 1], ['kick', 1], ['dead', 1], ['idle', -1], ['aim', 0.0001]];
const ps = [];
rows.forEach((lk, ri) => poses.forEach(([k, face, ph, sp], i) => {
  const p = new Person3D(lk, i); scene.add(p.root);
  const st = { x: 0, face, kind: k, air: k === 'jump' || k === 'kick', vy: 0.5, aimTarget: k.startsWith('aim') ? 1 : 0, aimForce: k.startsWith('aim') ? 1 : undefined, gunY: k === 'aimLow' ? 0.72 : 1.3, kickT: 0.25, deadT: 1.2, t: 1 };
  if (k === 'move') { for (let n = 0; n < 40; n++) { st.x += (sp || 1) / 60; p.update(i * 1.35, 3.4 - ri * 1.95, 0, st, 1 / 60); } }
  else for (let n = 0; n < 30; n++) p.update(i * 1.35, 3.4 - ri * 1.95, 0, st, 1 / 60);
  p.root.position.set(i * 1.35, 3.4 - ri * 1.95, 0);
  if (i === poses.length - 1) p.inner.rotation.y = Math.PI / 2 + 0.0; // 正面（カメラ向き）
}));
r.render(scene, cam); window.done = true;
</script>
