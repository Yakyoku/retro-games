<div id="start">クリックで音を出す</div>
<header><h1>SOUND TEST</h1><p>4 オペレータ FM × 8 音（曲は 0〜5、効果音は 6・7）＋ 8bit・8kHz の粗い PCM × 4（曲は 0・1、効果音は 2・3）。音声スレッド（AudioWorklet）で 1 サンプルずつ合成しています。曲・音色・効果音はすべてこの作品のために新しく作りました。</p></header>
