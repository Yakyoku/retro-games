<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070912">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="NIGHT SHAFT — 夜のビルに潜入し、エレベーターとエスカレーターを乗り継いで機密書類を回収するスパイアクション（2D 版）。">
<title>NIGHT SHAFT — 2D</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="ゲーム画面"></canvas>

  <header id="hud" hidden>
    <div class="hud-l">
      <div class="stat"><span class="k">SCORE</span><b id="h-score">0</b></div>
      <div class="stat hide-s"><span class="k">HI</span><b id="h-hi">0</b></div>
    </div>
    <div class="hud-c">
      <div class="stat"><span class="k">書類</span><b id="h-docs">0/6</b></div>
      <div class="stat"><span class="k">現在</span><b id="h-floor">30F</b></div>
      <div id="h-left" class="chips" aria-label="未回収の書類がある階"></div>
    </div>
    <div class="hud-r">
      <div id="h-lives" class="lives" aria-label="残機"></div>
      <button id="btn-pause" class="icon-btn" aria-label="一時停止">II</button>
    </div>
  </header>
  <canvas id="minimap" width="60" height="300" hidden aria-hidden="true"></canvas>
  <div id="hint" hidden></div>
  <div id="toast" hidden></div>

  <div id="touch" hidden>
    <div class="t-left"><div class="dpad" data-pad><span class="u">▲</span><span class="d">▼</span><span class="l">◀</span><span class="r">▶</span></div></div>
    <div class="t-right">
      <button class="tb tb-up" data-btn="up"><span>操作</span><small id="t-ctx">↑</small></button>
      <button class="tb tb-jump" data-btn="jump"><span>ジャンプ</span></button>
      <button class="tb tb-fire" data-btn="fire"><span>射撃</span></button>
    </div>
  </div>

  <!-- 画面（タイトル・選択・一時停止・結果など）はここに差し込む -->
  <section id="screen" aria-live="polite"></section>

  <div id="loading"><div class="spin"></div><p>読み込み中…</p></div>
  <div id="rotate" hidden><p>画面を横向きにすると広く見えます<br><small>縦向きのままでも遊べます</small></p></div>
  <div id="debug" hidden></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
