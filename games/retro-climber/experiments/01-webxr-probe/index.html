<h1>WebXR の小さな検証</h1>
<p>本編の前に、Meta Quest 3 の Meta Quest Browser で「HTTPS で読み込める・VR を始められる・左右の目に別の絵が届く・頭の追跡・左右のコントローラー・板の文字・VR の終了と再入場」を確かめるページです。</p>
<p>VR の中では、<b>左目にだけ赤い「L」、右目にだけ青い「R」</b>が見えれば左右眼の描き分けが正しく動いています。右トリガーで目の前の板の色が変わります。右 B で VR を終了します。</p>
<p><button id="go">VR を開始</button> <a href="../../" style="color:#ffc51a">← ゲームへ</a></p>

document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a2440);
const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 100);

const floor = new THREE.GridHelper(10, 20, 0x5577aa, 0x334466); scene.add(floor);
function label(t, color) { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); g.fillStyle = color; g.font = '900 200px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t, 128, 136); const tx = new THREE.CanvasTexture(c); return new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.4), new THREE.MeshBasicMaterial({ map: tx, transparent: true })); }
const L = label('L', '#ff4040'); L.position.set(-0.25, 1.5, -1.5); L.layers.set(1); scene.add(L);   // 左目だけ（レイヤー 1）
const R = label('R', '#40a0ff'); R.position.set(0.25, 1.5, -1.5); R.layers.set(2); scene.add(R);   // 右目だけ（レイヤー 2）
const pc = document.createElement('canvas'); pc.width = 1024; pc.height = 512; const pg = pc.getContext('2d'); const ptex = new THREE.CanvasTexture(pc);

let color = '#22304f', enters = 0;
const ctrls = [0, 1].map((i) => { const c = renderer.xr.getControllerGrip(i); const m = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.12), new THREE.MeshStandardMaterial({ color: i ? 0x40a0ff : 0xff6040 })); c.add(m); scene.add(c); const t = renderer.xr.getController(i); scene.add(t); let src = null; t.addEventListener('connected', (e) => (src = e.data)); t.addEventListener('disconnected', () => (src = null)); return { get src() { return src; } }; });
let prevTrig = false;

renderer.setAnimationLoop((t, frame) => {

  if (renderer.xr.isPresenting && xrc.cameras.length === 2) { xrc.cameras[0].layers.enable(1); xrc.cameras[1].layers.enable(2); }

  for (const c of ctrls) { const s = c.src; if (!s || !s.gamepad) continue; const gp = s.gamepad; txt.push(`${s.handedness}: 軸 ${[...gp.axes].map((a) => a.toFixed(1)).join(' ')}  押下 ${gp.buttons.map((b, i) => (b.pressed ? i : '')).filter((x) => x !== '').join(',')}`);
    if (s.handedness === 'right') { const trig = gp.buttons[0] && gp.buttons[0].pressed; if (trig && !prevTrig) color = color === '#22304f' ? '#2f7a3a' : '#22304f'; prevTrig = trig; if (gp.buttons[5] && gp.buttons[5].pressed) renderer.xr.getSession().end(); } }
  pg.fillStyle = color; pg.fillRect(0, 0, 1024, 512); pg.fillStyle = '#fff'; pg.font = '600 40px sans-serif'; txt.forEach((l, i) => pg.fillText(l, 30, 70 + i * 56)); pg.fillText('右トリガー: 色を変える　右 B: 終了', 30, 480); ptex.needsUpdate = true;

};
