<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="generator" content="Claude Code">
<meta name="theme-color" content="#0b1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ツイン・ガーデン 2D</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/shared/ui/style.css">
<style>
  .tstick { position: fixed; display: none; border-radius: 50%; z-index: 8; pointer-events: none; border: 2px solid rgba(255,255,255,.35); background: radial-gradient(circle, rgba(255,255,255,.08), rgba(255,255,255,.02)); }
  .tstick.r { border-color: rgba(255,110,115,.6); } .tstick.b { border-color: rgba(100,180,255,.6); }
  .tstick .knob { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: 0 0 20px rgba(255,255,255,.4); }
  .tstick.b .knob { border-radius: 28%; }
  .tpause { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: calc(var(--hud-h) + 8px + env(safe-area-inset-top)); z-index: 9; display: none; width: 52px; height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.45); color: #fff; font-size: 22px; }
  .thint { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); display: none; justify-content: space-around; z-index: 7; pointer-events: none; color: rgba(255,255,255,.7); font-size: 15px; transition: opacity .6s; }
  .touch-on .tpause { display: block; } .touch-on .thint { display: flex; }
  .debug { position: fixed; left: 8px; bottom: 8px; z-index: 20; font: 12px ui-monospace, monospace; background: rgba(0,0,0,.7); padding: 4px 8px; border-radius: 6px; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; background: #0b1410; color: #cfe; font-size: 18px; }
</style>
<script src="/shared/error-overlay.js"></script>
</head>
<body>
<div id="app"><canvas id="view" aria-label="盤面"></canvas></div>
<div id="boot">よみこみ中…</div>
<noscript>JavaScript を有効にしてください。</noscript>
<script type="module">
  import('/experiments/01-2d/main.js').then(() => document.getElementById('boot').remove()).catch((e) => {
    const b = document.getElementById('boot');
    b.innerHTML = '読み込みに失敗しました。<br><button onclick="location.reload()">もう一度</button><br><small></small>';
    b.querySelector('small').textContent = String(e && e.message || e);
  });
</script>
</body>
</html>
